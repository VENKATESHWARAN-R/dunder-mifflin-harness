default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uvx ruff format src tests
        language: system
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        entry: uvx ruff check src tests
        language: system
        pass_filenames: false
      - id: ty-check
        name: ty check
        entry: uvx ty check src tests
        language: system
        pass_filenames: false
      - id: pytest-full
        name: pytest full suite
        entry: uv run pytest tests
        language: system
        pass_filenames: false
        stages: [pre-push]
