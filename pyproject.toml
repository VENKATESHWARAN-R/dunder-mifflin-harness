[project]
name = "jac"
version = "0.4.1"
description = "JAC — Just Another CLI. A multi-agent dev harness with tier-routed model selection."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "click>=8.3.1",
    "logfire>=4.31.0",
    "prompt-toolkit>=3.0.52",
    "pydantic>=2.12.5",
    "pydantic-ai-slim[a2a,anthropic,cli,duckduckgo,evals,fastmcp,google,logfire,mistral,openai,openrouter]>=1.73.0",
    "pydantic-settings>=2.13.1",
    "rich>=14.3.3",
]

[project.scripts]
jac = "jac.cli.main:main"

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pre-commit>=4.3.0",
    "pytest>=9.0.2",
]

# Research / experimental deps used only by lab/ scripts and notebooks.
# Not shipped with the JAC core install.
lab = [
    "deepagents>=0.4.12",
    "google-adk>=1.14.1",
    "google-genai>=1.69.0",
    "langchain-openai>=1.1.12",
    "langfuse>=4.0.4",
    "langgraph>=1.1.3",
]

[tool.uv.workspace]
members = ["lab/specimens/pygemini"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
